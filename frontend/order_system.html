<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Management - PostgreSQL</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 30px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .form-section {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            border-left: 4px solid #667eea;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
            font-size: 14px;
        }

        input, select {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-family: inherit;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        button.primary {
            background: #667eea;
            color: white;
        }

        button.primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        button.secondary {
            background: #ecf0f1;
            color: #333;
        }

        button.secondary:hover {
            background: #d5dbdb;
        }

        .status-message {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .status-message.success {
            background: #d5f4e6;
            color: #27ae60;
            display: block;
            border-left: 4px solid #27ae60;
        }

        .status-message.error {
            background: #fadbd8;
            color: #e74c3c;
            display: block;
            border-left: 4px solid #e74c3c;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        thead {
            background: #f0f0f0;
        }

        th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #ddd;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background: #f9f9f9;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-pending {
            background: #ffeaa7;
            color: #d63031;
        }

        .status-processing {
            background: #81ecec;
            color: #0984e3;
        }

        .status-completed {
            background: #55efc4;
            color: #00b894;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn-edit {
            background: #3498db;
            color: white;
        }

        .btn-delete {
            background: #e74c3c;
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Order Management System</h1>
        <p class="subtitle">PostgreSQL + Flask API + Real Database</p>

        <!-- Status Messages -->
        <div id="statusMessage" class="status-message"></div>

        <!-- Form Section -->
        <div class="form-section">
            <h2>Create New Order</h2>
            
            <div class="form-grid">
                <div class="form-group">
                    <label for="customerId">Customer ID *</label>
                    <input type="number" id="customerId" placeholder="e.g., 1" min="1">
                </div>

                <div class="form-group">
                    <label for="quantity">Quantity *</label>
                    <input type="number" id="quantity" placeholder="e.g., 5" min="1">
                </div>

                <div class="form-group">
                    <label for="unitPrice">Unit Price ($) *</label>
                    <input type="number" id="unitPrice" placeholder="e.g., 999.99" step="0.01" min="0">
                </div>

                <div class="form-group">
                    <label for="productId">Product ID *</label>
                    <input type="number" id="productId" placeholder="e.g., 1" min="1">
                </div>

                <div class="form-group">
                    <label for="status">Status *</label>
                    <select id="status">
                        <option value="">-- Select Status --</option>
                        <option value="pending">Pending</option>
                        <option value="processing">Processing</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="notes">Notes (Optional)</label>
                    <input type="text" id="notes" placeholder="Special instructions...">
                </div>
            </div>

            <div class="button-group">
                <button class="primary" id="submitBtn">Create Order</button>
                <button class="secondary" id="resetBtn">Clear Form</button>
                <button class="secondary" id="refreshBtn">Refresh Orders</button>
            </div>
        </div>

        <!-- Table Section -->
        <div class="table-section">
            <h2>Orders</h2>
            <div id="ordersContainer"></div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">Edit Order</div>
            <div class="form-group">
                <label for="editQuantity">Quantity</label>
                <input type="number" id="editQuantity" min="1">
            </div>
            <div class="form-group">
                <label for="editStatus">Status</label>
                <select id="editStatus">
                    <option value="pending">Pending</option>
                    <option value="processing">Processing</option>
                    <option value="completed">Completed</option>
                </select>
            </div>
            <div class="modal-buttons">
                <button class="secondary" id="cancelEditBtn">Cancel</button>
                <button class="primary" id="saveEditBtn">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        // API Configuration
        const API_BASE = 'http://localhost:5000/api';

        // DOM Elements
        const form = {
            customerId: document.getElementById('customerId'),
            productId: document.getElementById('productId'),
            quantity: document.getElementById('quantity'),
            unitPrice: document.getElementById('unitPrice'),
            status: document.getElementById('status'),
            notes: document.getElementById('notes')
        };

        const buttons = {
            submit: document.getElementById('submitBtn'),
            reset: document.getElementById('resetBtn'),
            refresh: document.getElementById('refreshBtn'),
            cancelEdit: document.getElementById('cancelEditBtn'),
            saveEdit: document.getElementById('saveEditBtn')
        };

        const modal = {
            editModal: document.getElementById('editModal'),
            editQuantity: document.getElementById('editQuantity'),
            editStatus: document.getElementById('editStatus')
        };

        let currentEditingOrderId = null;

        // Show message
        function showMessage(text, type) {
            const msg = document.getElementById('statusMessage');
            msg.textContent = text;
            msg.className = `status-message ${type}`;
            setTimeout(() => {
                msg.className = 'status-message';
            }, 5000);
        }

        // Get all orders from API
        async function loadOrders() {
            try {
                const container = document.getElementById('ordersContainer');
                container.innerHTML = '<div class="loading">Loading orders...</div>';

                const response = await fetch(`${API_BASE}/orders`);
                const data = await response.json();

                if (!data.success) {
                    container.innerHTML = '<div class="empty-state">Error loading orders</div>';
                    return;
                }

                const orders = data.data;

                if (orders.length === 0) {
                    container.innerHTML = '<div class="empty-state">No orders yet. Create one to get started.</div>';
                    return;
                }

                let html = `
                    <table>
                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>Customer ID</th>
                                <th>Product ID</th>
                                <th>Qty</th>
                                <th>Unit Price</th>
                                <th>Total</th>
                                <th>Status</th>
                                <th>Created</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                orders.forEach(order => {
                    const createdDate = new Date(order.created_at).toLocaleDateString();
                    const statusClass = `status-${order.status}`;
                    html += `
                        <tr>
                            <td>${order.order_id}</td>
                            <td>${order.customer_id}</td>
                            <td>${order.product_id}</td>
                            <td>${order.quantity}</td>
                            <td>$${parseFloat(order.unit_price).toFixed(2)}</td>
                            <td>$${parseFloat(order.total_price).toFixed(2)}</td>
                            <td><span class="status-badge ${statusClass}">${order.status}</span></td>
                            <td>${createdDate}</td>
                            <td>
                                <div class="action-buttons">
                                    <button class="btn-small btn-edit" onclick="editOrder(${order.order_id})">Edit</button>
                                    <button class="btn-small btn-delete" onclick="deleteOrder(${order.order_id})">Delete</button>
                                </div>
                            </td>
                        </tr>
                    `;
                });

                html += `</tbody></table>`;
                container.innerHTML = html;
            } catch (error) {
                document.getElementById('ordersContainer').innerHTML = `<div class="empty-state">Error: ${error.message}</div>`;
            }
        }

        // Create order
        buttons.submit.addEventListener('click', async () => {
            const customerId = parseInt(form.customerId.value);
            const productId = parseInt(form.productId.value);
            const quantity = parseInt(form.quantity.value);
            const unitPrice = parseFloat(form.unitPrice.value);
            const status = form.status.value;
            const notes = form.notes.value;

            if (!customerId || !productId || !quantity || !unitPrice || !status) {
                showMessage('Please fill all required fields', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/orders`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        customer_id: customerId,
                        product_id: productId,
                        quantity: quantity,
                        unit_price: unitPrice,
                        status: status,
                        notes: notes
                    })
                });

                const data = await response.json();

                if (response.status === 201) {
                    showMessage(`Order #${data.data.order_id} created successfully!`, 'success');
                    
                    // Clear form
                    Object.keys(form).forEach(key => {
                        form[key].value = '';
                    });

                    // Reload orders
                    loadOrders();
                } else {
                    showMessage(`Error: ${data.error || 'Failed to create order'}`, 'error');
                }
            } catch (error) {
                showMessage(`Error: ${error.message}`, 'error');
            }
        });

        // Reset form
        buttons.reset.addEventListener('click', () => {
            Object.keys(form).forEach(key => {
                form[key].value = '';
            });
        });

        // Refresh orders
        buttons.refresh.addEventListener('click', () => {
            loadOrders();
        });

        // Edit order
        window.editOrder = (orderId) => {
            currentEditingOrderId = orderId;
            modal.editQuantity.value = '';
            modal.editStatus.value = 'pending';
            modal.editModal.classList.add('show');
        };

        buttons.cancelEdit.addEventListener('click', () => {
            modal.editModal.classList.remove('show');
            currentEditingOrderId = null;
        });

        buttons.saveEdit.addEventListener('click', async () => {
            const quantity = parseInt(modal.editQuantity.value);
            const status = modal.editStatus.value;

            if (!quantity || quantity < 1) {
                showMessage('Quantity must be at least 1', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/orders/${currentEditingOrderId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        quantity: quantity,
                        status: status
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage('Order updated successfully!', 'success');
                    modal.editModal.classList.remove('show');
                    loadOrders();
                } else {
                    showMessage(`Error: ${data.error}`, 'error');
                }
            } catch (error) {
                showMessage(`Error: ${error.message}`, 'error');
            }
        });

        // Delete order
        window.deleteOrder = async (orderId) => {
            if (!confirm('Are you sure you want to delete this order?')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/orders/${orderId}`, {
                    method: 'DELETE'
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage('Order deleted successfully!', 'success');
                    loadOrders();
                } else {
                    showMessage(`Error: ${data.error}`, 'error');
                }
            } catch (error) {
                showMessage(`Error: ${error.message}`, 'error');
            }
        };

        // Initial load
        loadOrders();
    </script>
</body>
</html>
